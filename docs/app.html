<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Number One VIP</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{background:#0A0805;color:#F8F4EC;font-family:system-ui;padding:16px;max-width:480px;margin:auto}.c{background:#15110B;border:1px solid #D4AF3744;border-radius:16px;padding:14px;margin-bottom:12px}input{width:100%;padding:11px;margin:6px 0 10px;border-radius:10px;background:#0D0A06;border:1px solid #D4AF3744;color:#fff;box-sizing:border-box}button{width:100%;padding:12px;border:none;border-radius:12px;background:linear-gradient(135deg,#F3D58D,#D4AF37);color:#140F07;font-weight:900;margin-top:6px;cursor:pointer}.b2{background:#1F1910;color:#F6DF9B;border:1px solid #D4AF3755}</style></head><body><div id="v"></div><script>const sb=supabase.createClient("https://rlxcsnposxvsyhwtmgbz.supabase.co","sb_publishable_0JRFmUNoVPY-SJjde4UmRg_MiFs94lD");let u=null;async function init(){const{data}=await sb.auth.getUser();u=data?.user;draw();}async function auth(s){const e=email.value.trim(),p=pass.value;const r=s?await sb.auth.signUp({email:e,password:p}):await sb.auth.signInWithPassword({email:e,password:p});if(r.error)return alert(r.error.message);u=r.data.user;draw();}async function buy(id){const r=await sb.rpc("create_wallet_order",{p_service_id:id,p_request_id:crypto.randomUUID()});alert(r.error?r.error.message:"✅ تم إرسال الطلب بنجاح!");draw();}async function draw(){const v=document.getElementById("v");if(!u){v.innerHTML='<div class="c"><h3>👑 تسجيل الدخول — Number One VIP</h3><input id="email" placeholder="البريد الإلكتروني" dir="ltr"><input id="pass" type="password" placeholder="كلمة المرور" dir="ltr"><button onclick="auth(0)">تسجيل الدخول</button><button class="b2" onclick="auth(1)">إنشاء حساب جديد</button></div>';return;}const[w,sv,or]=await Promise.all([sb.rpc("wallet_get_my_summary"),sb.from("services").select("*").eq("is_active",true),sb.from("orders").select("*").order("created_at",{ascending:false}).limit(10)]);const bal=w.data?.;v.innerHTML=`<div class="c"><b style="color:#F6DF9B">💰 المحفظة: ${Number(bal?.balance||0).toFixed(2)} USDT</b><div style="font-size:12px;color:#A99E8C;margin-top:4px">${u.email}</div></div><div class="c"><b>👑 الباقات والخدمات المتاحة</b>${(sv.data||[]).map(x=>`<div style="border-top:1px solid #D4AF3722;padding:8px 0"><b>${x.name_ar||x.name} — ${x.price_usdt} USDT</b><button onclick="buy('${x.id}')">شراء الآن من المحفظة</button></div>`).join("")}</div><div class="c"><b>🧾 آخر طلباتي (${(or.data||[]).length})</b>${(or.data||[]).map(o=>`<div style="font-size:13px;padding:4px 0">• ${o.service_name||"طلب"} (${o.status}) ${o.phone_number||""}</div>`).join("")}</div><button class="b2" onclick="sb.auth.signOut().then(()=>{u=null;draw();})">تسجيل الخروج</button>`;}init();</script></body></html>
