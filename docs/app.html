<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number One VIP — منصة الويب</title>
<script src="https://jsdelivr.net"></script>
<style>
  :root { --bg:#0D0C0A; --card:#171510; --card2:#211D15; --gold:#D4AF37; --gold2:#F3D59B; --text:#F5F2EB; --muted:#A89F8E; --ok:#22C55E; --err:#EF4444; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); padding-bottom:84px; }
  .wrap { max-width:560px; margin:0 auto; padding:14px; }
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:10px 4px 16px; }
  .brand { font-size:20px; font-weight:900; color:var(--gold2); display:flex; align-items:center; gap:8px; }
  .card { background:var(--card); border:1px solid rgba(212,175,55,0.28); border-radius:20px; padding:16px; margin-bottom:14px; }
  .hero { background:linear-gradient(135deg,#251E12,#14110C,#2D2312); border:1.3px solid rgba(212,175,55,0.55); border-radius:22px; padding:18px; margin-bottom:14px; }
  .bal { font-size:32px; font-weight:900; color:var(--gold2); direction:ltr; text-align:right; margin:6px 0 12px; }
  .btn { width:100%; padding:13px 16px; border-radius:14px; border:none; background:linear-gradient(135deg,#F3D59B,#D4AF37,#B8860B); color:#0D0C0A; font-weight:900; font-size:15px; cursor:pointer; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn-out { width:100%; padding:11px 14px; border-radius:13px; border:1px solid rgba(212,175,55,0.45); background:var(--card2); color:var(--gold2); font-weight:800; font-size:14px; cursor:pointer; }
  .inp, select, textarea { width:100%; padding:12px 14px; border-radius:13px; border:1px solid rgba(212,175,55,0.3); background:#11100C; color:var(--text); font-size:14px; margin-top:6px; margin-bottom:10px; }
  .row { display:flex; gap:10px; align-items:center; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tile { background:var(--card); border:1px solid rgba(212,175,55,0.25); border-radius:16px; padding:14px; cursor:pointer; text-align:right; }
  .tile b { display:block; font-size:15px; color:var(--gold2); margin-bottom:3px; }
  .tile span { font-size:12px; color:var(--muted); }
  .copybox { display:flex; justify-content:space-between; align-items:center; background:#100F0B; border:1px solid rgba(212,175,55,0.3); border-radius:12px; padding:10px 12px; margin:8px 0; }
  .copybox code { color:var(--gold2); font-weight:800; direction:ltr; font-size:13px; word-break:break-all; }
  .copybtn { background:rgba(212,175,55,0.18); color:var(--gold2); border:1px solid var(--gold); border-radius:9px; padding:5px 10px; font-weight:800; cursor:pointer; white-space:nowrap; margin-right:8px; }
  .nav { position:fixed; bottom:0; left:0; right:0; background:#14120E; border-top:1px solid rgba(212,175,55,0.3); display:flex; justify-content:space-around; padding:8px 4px; z-index:50; }
  .nav button { background:none; border:none; color:var(--muted); font-weight:800; font-size:12px; cursor:pointer; padding:6px 10px; border-radius:12px; }
  .nav button.active { background:linear-gradient(135deg,#F3D59B,#D4AF37); color:#0D0C0A; }
  .badge { display:inline-block; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:800; background:rgba(212,175,55,0.18); color:var(--gold2); }
  .msg { padding:11px 14px; border-radius:13px; font-size:13px; font-weight:700; margin-bottom:12px; }
  .msg.ok { background:rgba(34,197,94,0.15); border:1px solid var(--ok); color:#86EFAC; }
  .msg.err { background:rgba(239,68,68,0.15); border:1px solid var(--err); color:#FCA5A5; }
  .muted { color:var(--muted); font-size:13px; line-height:1.6; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap" id="app">جارٍ التحميل…</div>
<nav class="nav hidden" id="bottomNav">
  <button id="tab-home" class="active" onclick="go('home')">🏠 الرئيسية</button>
  <button id="tab-vip" onclick="go('vip')">👑 أرقام خاصة</button>
  <button id="tab-instant" onclick="go('instant')">⚡ فوري</button>
  <button id="tab-more" onclick="go('more')">☰ المزيد</button>
</nav>
<script src="app.js"></script>
</body>
</html>
