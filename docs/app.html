<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Number One VIP</title><style>body{background:#0A0805;color:#F8F4EC;font-family:system-ui,sans-serif;padding:16px;max-width:480px;margin:auto}.c{background:#15110B;border:1px solid #D4AF3755;border-radius:18px;padding:16px;margin-bottom:12px}input{width:100%;padding:12px;margin:6px 0 12px;border-radius:12px;background:#0D0A06;border:1px solid #D4AF3755;color:#fff;box-sizing:border-box;font-size:15px}button{width:100%;padding:13px;border:none;border-radius:13px;background:linear-gradient(135deg,#F3D58D,#D4AF37);color:#140F07;font-weight:900;font-size:15px;margin-top:6px;cursor:pointer}.b2{background:#1F1910;color:#F6DF9B;border:1px solid #D4AF3766}.msg{padding:10px;border-radius:10px;background:#EF444422;border:1px solid #EF444466;color:#FCA5A5;margin-bottom:10px;font-size:13px}</style></head><body><div id="v"></div><script>
const U="https://rlxcsnposxvsyhwtmgbz.supabase.co",K="sb_publishable_0JRFmUNoVPY-SJjde4UmRg_MiFs94lD";let tok=localStorage.getItem("no_tok")||"",usr=JSON.parse(localStorage.getItem("no_usr")||"null"),err="";
async function api(p,opt={}){const h={"apikey":K,"Content-Type":"application/json",...(tok?{"Authorization":"Bearer "+tok}:{})};const r=await fetch(U+p,{...opt,headers:h});const t=await r.text();let d=null;try{d=JSON.parse(t)}catch(e){}if(!r.ok)throw new Error(d?.error_description||d?.msg||d?.message||t||"خطأ");return d;}
async function auth(isUp){err="";try{const e=document.getElementById("em").value.trim(),p=document.getElementById("pw").value;const d=await api(isUp?"/auth/v1/signup":"/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email:e,password:p})});if(d.access_token){tok=d.access_token;usr=d.user;localStorage.setItem("no_tok",tok);localStorage.setItem("no_usr",JSON.stringify(usr));}else{err="تم إنشاء الحساب! تحقق من بريدك الإلكتروني ثم سجّل الدخول.";}}catch(ex){err=ex.message;}draw();}
async function buy(id){try{await api("/rest/v1/rpc/create_wallet_order",{method:"POST",body:JSON.stringify({p_service_id:id,p_request_id:crypto.randomUUID()})});alert("✅ تم إرسال الطلب بنجاح!");}catch(ex){alert("❌ "+ex.message);}draw();}
function out(){tok="";usr=null;localStorage.removeItem("no_tok");localStorage.removeItem("no_usr");draw();}
async function draw(){const v=document.getElementById("v");if(!tok||!usr){v.innerHTML=`<div class="c" style="text-align:center"><div style="font-size:36px">👑</div><h2 style="color:#F6DF9B;margin:6px 0">Number One VIP</h2><p style="color:#A99E8C;font-size:13px">سجّل الدخول أو أنشئ حساباً جديداً للوصول إلى محفظتك وطلباتك</p></div>${err?`<div class="msg">${err}</div>`:""}<div class="c"><label>البريد الإلكتروني</label><input id="em" type="email" dir="ltr" placeholder="name@example.com"><label>كلمة المرور</label><input id="pw" type="password" dir="ltr" placeholder="••••••••"><button onclick="auth(false)">تسجيل الدخول</button><button class="b2" onclick="auth(true)">إنشاء حساب جديد</button></div>`;return;}
v.innerHTML='<div class="c" style="text-align:center;color:#F6DF9B">جاري تحميل محفظتك والباقات…</div>';
try{const[w,sv,or]=await Promise.all([api("/rest/v1/rpc/wallet_get_my_summary",{method:"POST",body:"{}"}),api("/rest/v1/services?is_active=eq.true&select=*"),api("/rest/v1/orders?select=*&order=created_at.desc&limit=10")]);const bal=Array.isArray(w)?w:w;v.innerHTML=`<div class="c"><div style="color:#A99E8C;font-size:13px">رصيد المحفظة</div><div style="font-size:28px;font-weight:900;color:#F6DF9B;margin:4px 0">${Number(bal?.balance||0).toFixed(2)} USDT</div><div style="font-size:12px;color:#A99E8C">${usr.email}</div></div><div class="c"><b style="color:#F6DF9B">👑 الباقات والخدمات المتاحة</b>${(sv||[]).map(x=>`<div style="border-top:1px solid #D4AF3722;padding:10px 0"><b>${x.name_ar||x.name} — ${x.price_usdt} USDT</b><div style="font-size:12px;color:#A99E8C;margin:4px 0">${x.description_ar||""}</div><button onclick="buy('${x.id}')">شراء من رصيد المحفظة</button></div>`).join("")}</div><div class="c"><b style="color:#F6DF9B">🧾 آخر طلباتي (${(or||[]).length})</b>${(or||[]).map(o=>`<div style="font-size:13px;padding:6px 0;border-top:1px solid #D4AF3715">• ${o.service_name||"طلب"} — <b>${o.status}</b> ${o.phone_number||""}</div>`).join("")||'<div style="color:#A99E8C;font-size:13px;margin-top:6px">لا توجد طلبات بعد.</div>'}</div><button class="b2" onclick="out()">تسجيل الخروج</button>`;}catch(ex){out();}}
draw();
</script></body></html>
