name: Number One Admin Web Build

on:
  push:
    branches: [rebuild-v2]
    paths:
      - "admin-web/**"
      - ".github/workflows/admin-web-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "admin-web/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build web dashboard
        run: npm run build
