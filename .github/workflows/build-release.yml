name: Build Release APK

on:
  push:
    branches: [ main, master, v9-release, "fix/production-readiness-2026-11", "fix/hexz-backend-safety-2026-11" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore and validate Firebase configuration (optional)
        id: firebase
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            jq -e '
              .project_info.project_id
              and ([.client[]?.client_info.android_client_info.package_name]
                   | any(. == "com.numberone.numberone"))
            ' app/google-services.json > /dev/null
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Firebase configuration validated for the Android application."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Firebase secret not configured; FCM is disabled in this build."
          fi

      - name: Detect and restore release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            {
              printf 'storeFile=release.keystore\n'
              printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
              printf 'keyAlias=%s\n' "$KEY_ALIAS"
              printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            } > release.properties
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are incomplete; only the debug APK will be produced."
          fi

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify APK package and launcher icon
        env:
          RELEASE_SIGNING_AVAILABLE: ${{ steps.signing.outputs.available }}
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          verify_apk() {
            apk="$1"
            echo "Verifying $apk"
            "$AAPT" dump badging "$apk" | grep -F "package: name='com.numberone.numberone'"
            # Verify the launcher icon declaration in the packaged manifest and
            # the referenced mipmap resource in the APK resource table.
            "$AAPT" dump xmltree "$apk" AndroidManifest.xml | grep -E 'android:(roundIcon|icon)'
            "$AAPT" dump resources "$apk" | grep -F 'mipmap/ic_launcher'
          }
          verify_apk app/build/outputs/apk/debug/app-debug.apk
          if [ "$RELEASE_SIGNING_AVAILABLE" = "true" ]; then
            verify_apk app/build/outputs/apk/release/app-release.apk
          fi

      - name: Write build summary
        env:
          FIREBASE_ENABLED: ${{ steps.firebase.outputs.enabled }}
          RELEASE_SIGNING_AVAILABLE: ${{ steps.signing.outputs.available }}
        run: |
          {
            echo "## Number One Android build"
            echo "- Package: `com.numberone.numberone`"
            echo "- Firebase/FCM configured: `$FIREBASE_ENABLED`"
            echo "- Release signing configured: `$RELEASE_SIGNING_AVAILABLE`"
            echo "- Unit tests: passed"
            echo "- Debug APK package and launcher icon: verified"
            if [ "$RELEASE_SIGNING_AVAILABLE" = "true" ]; then
              echo "- Release APK package and launcher icon: verified"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NumberOne-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NumberOne-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
