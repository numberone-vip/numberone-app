name: Android build

on:
  push:
    branches: [main, rebuild-v2]
  pull_request:
    branches: [main, rebuild-v2]
  workflow_dispatch:

jobs:
  debug-build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.STOREFILE != '' && secrets.STOREPASSWORD != '' && secrets.KEYALIAS != '' && secrets.KEYPASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Configure release signing
        if: env.HAS_RELEASE_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.STOREFILE }}
          ANDROID_STORE_PASSWORD: ${{ secrets.STOREPASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEYALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEYPASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          test -s release.keystore
          {
            printf 'storeFile=release.keystore\n'
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > release.properties
      - name: Build signed release APK when signing secrets are configured
        if: env.HAS_RELEASE_SIGNING == 'true'
        run: bash ./gradlew :app:assembleRelease --stacktrace
      - name: Upload signed release APK
        if: success() && env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Number-One-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Build debug APK
        run: |
          set -o pipefail
          bash ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: build.log
          if-no-files-found: warn
          retention-days: 3
      - name: Upload debug APK
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rebuild-v2')
        uses: actions/upload-artifact@v4
        with:
          name: Number-One-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
