name: Android build

on:
  push:
    branches:
      - main
      - feature/real-supabase-integration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare build
        run: |
          chmod +x ./gradlew
          # This absolute AAPT2 path is only valid inside Code On The Go on the phone.
          sed -i '/^android\.aapt2FromMavenOverride=/d' gradle.properties

      - name: Compile, test, and assemble
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: number-one-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
